<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IBN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: wide white canvas, sharp-cornered like the logo; content comes from editable data, admin panel sits on top. */
:root {
  --paper: #ffffff;
  --ink: #0b0b0c;
  --mute: #66696d;
  --line: #e4e6e7;
  --tint: #f3f4f4;
  --tint-deep: #e9ebec;
  --sale: #e5391f;
  --display: "Readex Pro", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --body: "IBM Plex Sans Arabic", "Readex Pro", "Segoe UI", Tahoma, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
[hidden] { display: none !important; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.7;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 40; background: var(--paper);
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

.wrap {
  max-width: 1200px; margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.num { font-variant-numeric: tabular-nums; }
.latin { font-family: var(--display); letter-spacing: .18em; text-transform: uppercase; }

/* announcement */
.notice { background: var(--tint); font-size: 13px; color: var(--mute); }
.notice .wrap { display: flex; justify-content: center; gap: 8px; padding-block: 8px; text-align: center; }

/* header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: var(--paper); border-bottom: 1px solid var(--line);
}
.top .wrap { display: flex; align-items: center; gap: 24px; height: 64px; }
.brand img { display: block; height: 26px; width: auto; }
.nav { display: flex; gap: 28px; margin-inline-start: 24px; font-family: var(--display); font-weight: 500; font-size: 14px; }
.nav a { padding-block: 6px; border-bottom: 2px solid transparent; }
.nav a:hover { border-bottom-color: var(--ink); }
.spacer { margin-inline-end: auto; }
.cart-btn {
  display: inline-flex; align-items: center; gap: 10px; height: 40px; padding-inline: 14px;
  background: var(--paper); border: 1.5px solid var(--ink); border-radius: 2px;
  font-family: var(--display); font-weight: 500; font-size: 14px;
}
.cart-btn:hover { background: var(--ink); color: var(--paper); }
.cart-btn svg { width: 18px; height: 18px; }
.count {
  min-width: 22px; height: 22px; padding-inline: 6px; display: inline-grid; place-items: center;
  background: var(--ink); color: var(--paper); border-radius: 11px; font-size: 12px; line-height: 1;
}
.cart-btn:hover .count { background: var(--paper); color: var(--ink); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; height: 48px; padding-inline: 28px;
  font-family: var(--display); font-weight: 600; font-size: 15px; border-radius: 2px;
  border: 1.5px solid var(--ink); background: var(--ink); color: var(--paper);
}
.btn:hover { background: var(--paper); color: var(--ink); }
.btn:disabled { cursor: default; }
.btn.sm { height: 40px; padding-inline: 16px; font-size: 14px; }

/* hero */
.hero { padding-block: 48px 56px; }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.eyebrow { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--mute); margin: 0; }
.eyebrow::before { content: ""; width: 32px; height: 2px; background: var(--ink); }
.hero-art {
  position: relative; min-width: 0; aspect-ratio: 16 / 7; max-width: 100%;
  background: var(--tint); display: grid; place-items: center; overflow: hidden; cursor: pointer;
}
.hero-art::after {
  content: "IBN"; position: absolute; inset-inline: 0; bottom: -0.16em; text-align: center;
  font-family: var(--display); font-weight: 700; font-size: clamp(6rem, 22vw, 15rem); line-height: 1;
  color: var(--tint-deep); letter-spacing: .04em; direction: ltr; pointer-events: none;
}
.hero-art svg { position: relative; z-index: 1; width: auto; height: 78%; max-width: 70%; color: var(--ink); }
.hero-art img {
  position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; object-fit: contain;
  padding: 6% 14% 16%; mix-blend-mode: multiply;
}
.hero-tag {
  position: absolute; z-index: 2; inset-inline-start: 16px; bottom: 16px; max-width: calc(100% - 32px);
  display: flex; flex-wrap: wrap; gap: 2px 14px; align-items: baseline; padding: 10px 14px; background: var(--paper);
  font-size: 14px;
}
.hero-tag b { font-family: var(--display); font-weight: 600; }

/* shop */
.shop { padding-block: 24px 72px; scroll-margin-top: 90px; }
.shop-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(1.6rem, 4vw, 2.2rem); line-height: 1.2; }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 24px; max-width: 880px; }
.card { min-width: 0; display: flex; flex-direction: column; }
.thumb {
  position: relative; aspect-ratio: 1 / 1; width: 100%; max-width: 100%; background: var(--tint);
  display: grid; place-items: center; overflow: hidden; transition: background .2s;
  border: 0; padding: 0; color: inherit; cursor: pointer;
}
.card:hover .thumb { background: var(--tint-deep); }
.thumb svg { width: 62%; height: auto; color: var(--ink); }
.thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
.ph { font-family: var(--display); font-weight: 700; font-size: 2.2rem; letter-spacing: .1em; color: var(--tint-deep); }
.badge {
  position: absolute; z-index: 2; inset-block-start: 10px; inset-inline-start: 10px; padding: 2px 10px;
  background: var(--ink); color: var(--paper); font-family: var(--display); font-weight: 500; font-size: 12px; line-height: 1.7;
}
.badge.sale { background: var(--sale); }
.info { display: flex; flex-direction: column; gap: 2px; padding-block: 14px 12px; flex: 1; }
.cat { font-size: 11px; color: var(--mute); }
.name { margin: 0; font-family: var(--display); font-weight: 500; font-size: 15px; line-height: 1.5; }
.nm { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-align: inherit; cursor: pointer; }
.nm:hover { text-decoration: underline; text-underline-offset: 4px; }
.price { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-weight: 600; }
.price s { color: var(--mute); font-weight: 400; font-size: 13px; }
.add {
  height: 42px; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 2px;
  font-family: var(--display); font-weight: 500; font-size: 14px;
}
.add:hover, .add.done { background: var(--ink); color: var(--paper); }

/* footer */
.foot { padding-block: 56px 40px; scroll-margin-top: 90px; }
.foot-brand { min-width: 0; }
.foot-brand img { display: block; width: 150px; max-width: 100%; height: auto; }
.foot-brand p { margin: 16px 0 0; color: var(--mute); max-width: 44ch; white-space: pre-line; }
.foot-brand .foot-contact { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--ink); }
.foot-contact a { text-decoration: underline; text-underline-offset: 4px; }
.legal { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--mute); font-size: 12px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }
.admin-link { letter-spacing: .2em; color: var(--mute); }

/* product sheet */
.modal {
  position: fixed; inset: 0; z-index: 65; background: rgba(11, 11, 12, .45); display: grid; place-items: center; overflow-y: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.m-card { position: relative; background: var(--paper); width: min(920px, 100%); display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); max-height: 100%; overflow-y: auto; }
.m-x { position: absolute; z-index: 3; inset-block-start: 10px; inset-inline-end: 10px; }
.m-media { min-width: 0; }
.m-main { position: relative; aspect-ratio: 1 / 1; max-width: 100%; background: var(--tint); display: grid; place-items: center; overflow: hidden; }
.m-main img { width: 100%; height: 100%; object-fit: cover; display: block; }
.m-main svg { width: 62%; height: auto; color: var(--ink); }
.m-thumbs { display: flex; gap: 8px; padding: 10px; overflow-x: auto; }
.m-thumbs button { flex: none; width: 64px; height: 64px; padding: 0; border: 1.5px solid var(--line); background: var(--tint); border-radius: 2px; }
.m-thumbs button[aria-current="true"] { border-color: var(--ink); }
.m-thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.m-info { padding: 40px 24px 28px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.m-name { margin: 0; font-family: var(--display); font-weight: 700; font-size: 1.5rem; line-height: 1.35; }
.m-desc { white-space: pre-line; color: var(--mute); margin: 8px 0 16px; overflow-wrap: anywhere; }
.m-info .price { font-size: 18px; }

/* drawer */
.scrim {
  position: fixed; inset: 0; z-index: 50; background: rgba(11, 11, 12, .38);
  opacity: 0; visibility: hidden; transition: opacity .25s, visibility .25s;
}
.drawer {
  position: fixed; z-index: 60; top: 0; bottom: 0; left: 0; width: min(420px, 100%);
  display: flex; flex-direction: column; background: var(--paper);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px);
  transform: translateX(-102%); visibility: hidden; transition: transform .3s ease, visibility .3s;
}
.open .scrim { opacity: 1; visibility: visible; }
.open .drawer { transform: none; visibility: visible; }
.d-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--line); }
.d-head h2 { font-size: 20px; }
.x { width: 40px; height: 40px; background: var(--paper); border: 1.5px solid var(--line); border-radius: 2px; font-size: 20px; line-height: 1; }
.x:hover { border-color: var(--ink); }
.d-body { flex: 1; overflow-y: auto; padding: 8px 20px; }
.empty { padding: 56px 8px; text-align: center; color: var(--mute); }
.line { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 14px; padding-block: 16px; border-bottom: 1px solid var(--line); }
.line .thumb { cursor: default; }
.line .thumb svg { width: 70%; }
.line h3 { margin: 0; font-family: var(--display); font-weight: 500; font-size: 14px; line-height: 1.5; }
.line .p { color: var(--mute); font-size: 13px; }
.qty { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.qty button { width: 30px; height: 30px; background: var(--paper); border: 1.5px solid var(--line); border-radius: 2px; line-height: 1; }
.qty button:hover { border-color: var(--ink); }
.qty output { min-width: 32px; text-align: center; font-weight: 600; }
.qty .rm { width: auto; margin-inline-start: auto; padding-inline: 8px; border-color: transparent; color: var(--mute); font-size: 12px; text-decoration: underline; }
.d-foot { padding: 18px 20px 20px; border-top: 1px solid var(--line); display: grid; gap: 12px; }
.total { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--display); font-weight: 600; font-size: 18px; }
.note { margin: 0; min-height: 1.6em; font-size: 12px; color: var(--mute); }
.d-foot .btn { width: 100%; }

.toast {
  position: fixed; z-index: 95; left: 50%; transform: translate(-50%, 20px);
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--paper); padding: 10px 20px; border-radius: 2px; font-size: 14px;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* admin */
.login {
  position: fixed; inset: 0; z-index: 85; background: rgba(11, 11, 12, .45); display: grid; place-items: center; padding: 16px;
}
.l-card { background: var(--paper); width: min(380px, 100%); padding: 28px 24px; display: grid; gap: 14px; }
.l-card h2 { font-size: 1.4rem; }
.adm {
  position: fixed; inset: 0; z-index: 80; background: var(--paper); overflow-y: auto;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.adm .wrap { max-width: 820px; }
.adm-bar { position: sticky; top: 0; z-index: 2; background: var(--paper); border-bottom: 1px solid var(--line); }
.adm-bar .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding-block: 10px; }
.adm-bar b { font-family: var(--display); font-weight: 700; font-size: 17px; }
.adm-state { font-size: 12px; color: var(--mute); margin-inline-end: auto; }
.adm-state.dirty { color: var(--sale); }
.adm-tabs { display: flex; gap: 4px; }
.adm-tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; font-family: var(--display); font-weight: 500; font-size: 14px; color: var(--mute); }
.adm-tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.adm-body { padding-block: 24px 80px; }
.a-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.a-head h3 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 18px; }
.a-note { background: var(--tint); padding: 10px 14px; margin: 0 0 16px; font-size: 13px; }
.a-err { min-height: 1.6em; margin: 0 0 8px; color: var(--sale); font-size: 13px; }
.a-ok { color: var(--ink); }
.a-sub { color: var(--mute); font-size: 12px; }
.a-row { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 8px 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.a-th { width: 56px; height: 56px; background: var(--tint); display: grid; place-items: center; overflow: hidden; }
.a-th img { width: 100%; height: 100%; object-fit: cover; display: block; }
.a-th svg { width: 70%; height: auto; color: var(--ink); }
.a-acts { display: flex; flex-wrap: wrap; gap: 6px; }
.a-row .a-acts { grid-column: 1 / -1; }
.sm-btn {
  height: 36px; padding-inline: 12px; border: 1.5px solid var(--line); background: var(--paper);
  border-radius: 2px; font-family: var(--display); font-weight: 500; font-size: 13px;
}
.sm-btn:hover { border-color: var(--ink); }
.sm-btn:disabled { opacity: .4; cursor: default; }
.sm-btn:disabled:hover { border-color: var(--line); }
.sm-btn.danger { color: var(--sale); border-color: var(--sale); }
.fld { display: grid; gap: 6px; margin-bottom: 16px; min-width: 0; }
.fld label { font-family: var(--display); font-weight: 500; font-size: 13px; }
.fld small { color: var(--mute); font-size: 12px; }
.f-in {
  width: 100%; min-height: 44px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 2px;
  background: var(--paper); color: var(--ink); font: inherit;
}
.f-in:focus { outline: none; border-color: var(--ink); }
textarea.f-in { resize: vertical; line-height: 1.7; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 12px; }
.ed-imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.ed-img { display: grid; gap: 6px; align-content: start; min-width: 0; }
.ed-img img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; background: var(--tint); }
.ed-img .a-acts { align-items: center; }
.f-file { font: inherit; max-width: 100%; }
.a-sec { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); }

@media (max-width: 820px) {
  .nav { display: none; }
  .hero { padding-block: 28px 40px; }
  .hero-art { aspect-ratio: 4 / 3; }
  .hero-art svg { height: auto; width: 60%; max-width: 60%; }
  .hero-art img { padding: 6% 8% 20%; }
}
@media (max-width: 700px) {
  .m-card { grid-template-columns: minmax(0, 1fr); }
  .m-info { padding-top: 20px; }
}
@media (max-width: 620px) {
  .grid { gap: 24px 12px; }
  .top .wrap { gap: 12px; }
  .cart-btn span.lbl { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition: none !important; }
}
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }

/* interactive punching bag */
.a-th { position: relative; }
.bagwrap { position: absolute; inset: 0; z-index: 1; background: #000; overflow: hidden; display: block; }
.bagwrap[data-bag] { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.app .bagwrap img.bagimg {
  position: absolute; top: 0; left: 50%; right: auto; width: auto; height: var(--bh, 84%); max-width: none;
  padding: 0; object-fit: fill; mix-blend-mode: normal; transform-origin: 50% 0; transform: translateX(-50%);
  will-change: transform; pointer-events: none; -webkit-user-drag: none;
}
.hero-art .bagwrap { --bh: 100%; }
.bagwrap::before { content: ""; position: absolute; z-index: 3; top: 0; left: 50%; width: 46px; height: 7px; margin-left: -23px; background: linear-gradient(#5a5d61, #26282a); border-radius: 0 0 4px 4px; }
.bag-hint { position: absolute; z-index: 3; inset-inline: 0; bottom: 10px; text-align: center; font-size: 12px; color: rgba(255,255,255,.7); pointer-events: none; transition: opacity .4s; }
.bag-used .bag-hint { opacity: 0; }
.hit { position: absolute; z-index: 4; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; border: 2px solid rgba(255,255,255,.85); pointer-events: none; animation: hit .45s ease-out forwards; }
@keyframes hit { to { transform: scale(4.2); opacity: 0; } }
.bagcv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
</style>

</head>
<body>
<div class="app" dir="rtl" lang="ar" id="app">
  <div class="notice" id="notice"><div class="wrap"><span id="annText"></span></div></div>
